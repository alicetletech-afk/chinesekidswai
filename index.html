/* v1.3 Bubble motion — restrained, springy visualization; home unchanged. */

@keyframes bubbleDrift{0%,100%{transform:translate(0,0)}40%{transform:translate(var(--dx,2px),-5px)}72%{transform:translate(calc(var(--dx,2px) * -.5),2px)}}
@keyframes haloBreath{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.9;transform:scale(1.055)}}
@keyframes linkBloom{from{opacity:.12}to{opacity:1}}

 if(help)help.textContent='กำลังโหลดรายการ HSK 1–6…';
 try{

   const d={id,py:t.pinyin,th:en?en:'ยังไม่มีคำแปล',kind:[...id].length===1?'char':'word',hskLevel:i+1,level:Math.min(i+1,3),radical:e.radical||'',numeric:t.numeric||'',aliases:[t.numeric||''],englishFallback:true,ex:''};
   D.push(d);byId[id]=d;
  }));
  hskLoaded=true;hskAvailable=true;createHskLinks();
  if(help)help.textContent='เลือกคำตั้งต้นที่มีความสัมพันธ์ · กราฟอาจแสดงศัพท์ข้ามระดับเพื่อเชื่อมคำ · EN หมายถึงคำที่รอตรวจแปลไทย';
 }catch(err){
  hskAvailable=false;
  if(help)help.textContent='ยังโหลดคลัง HSK ออนไลน์ไม่ได้ — แสดงเฉพาะศัพท์ตัวอย่างที่อยู่ในไฟล์';
 }finally{hskLoading=false; if(document.body.classList.contains('in-module')){seeds=Object.keys(modeConfig.map).filter(id=>byId[id]);list();}}
}

let currentMode='family',currentLevel=1;
const configs={family:{map:family,title:'Character Family',sub:'เลือกส่วนประกอบอักษร',desc:'เลือกตัวที่อยากสำรวจ'},build:{map:build,title:'Word Building',sub:'เลือกตัวอักษรเริ่มต้น',desc:'ดูว่าแต่ละตัวประกอบเป็นคำอะไรได้บ้าง'},expand:{map:expand,title:'Word Expansion Tree',sub:'เลือกคำเริ่มต้น',desc:'ต่อยอดจากคำสู่คำและประโยค'}};
let modeConfig=configs[currentMode];
const $=id=>document.getElementById(id);
const strip=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v').replace(/[\s'’?!？。，]/g,'');
const keys=d=>[d.id,d.py,d.th,d.numeric||'',...(d.aliases||[])];
function found(d,q){if(!q)return true;return keys(d).some(x=>strip(x).includes(strip(q)));}
let seeds=[];
function selectMode(m){loadHSK();currentMode=m;modeConfig=configs[m];seeds=Object.keys(modeConfig.map).filter(id=>byId[id]);$('mode-title').textContent=modeConfig.title;$('viewer-brand').textContent=modeConfig.title;$('mode-sub').textContent=modeConfig.sub;$('mode-desc').textContent=modeConfig.desc;$('query').value='';$('viewer').classList.add('hidden');$('picker').classList.remove('hidden');document.body.classList.add('in-module');list();window.scrollTo(0,0)}
document.querySelectorAll('#home .tile').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
$('to-home').onclick=()=>{document.body.classList.remove('in-module');$('viewer').classList.add('hidden');$('picker').classList.remove('hidden');window.scrollTo(0,0)};

function list(){
 const q=$('query').value.trim();
 const allStarts=Object.keys(modeConfig.map).filter(k=>byId[k]&&(modeConfig.map[k]||[]).some(x=>byId[x]));
 const matching=allStarts.filter(id=>{
  const d=byId[id];if(!found(d,q))return false;
  if(q && d.id.includes(q))return true;
  if(!hskAvailable)return true;
  if(currentMode==='family')return (modeConfig.map[id]||[]).some(x=>byId[x]?.hskLevel===currentLevel);
  if(d.hskLevel===currentLevel)return true;
  // Search may find a root from an earlier level which leads into selected HSK level.
  return (modeConfig.map[id]||[]).some(x=>byId[x]?.hskLevel===currentLevel);
 });
 const results=matching.slice(0,450);
 $('count').textContent=`${matching.length} คำที่มีความเชื่อมโยง · HSK ${currentLevel}${hskAvailable?'':' (ข้อมูลทดลอง)'}`;
 $('words').replaceChildren();
 results.forEach(id=>{const d=byId[id],b=document.createElement('button');b.className='word';b.type='button';b.innerHTML='<div class="han"></div><div class="pinyin"></div><div class="thai"></div>';
 b.children[0].textContent=d.id;b.children[1].textContent=d.py;
 b.children[2].textContent=(d.englishFallback?'EN · ':'')+d.th;
 b.setAttribute('aria-label',d.id+' '+d.py+' '+d.th);b.onclick=()=>openGraph(d.id);$('words').append(b)});
 if(!results.length){const p=document.createElement('p');p.className='empty';p.textContent='ยังไม่มีความเชื่อมโยงที่ตรวจพบในระดับนี้ ลองค้นคำอื่นหรือเปลี่ยน HSK';$('words').append(p)}
}
document.querySelectorAll('.level-option').forEach(b=>b.addEventListener('click',()=>{currentLevel=Number(b.dataset.level);document.querySelectorAll('.level-option').forEach(x=>x.classList.toggle('active',x===b));list()}));
$('query').addEventListener('input',list);list();
let seed='',selected='',scale=1,panX=0,panY=0,detailOpen=false;let openedBranches=new Set();let bubbleRAF=0;let visualNodes=[],visualEdges=[];
function openGraph(id){seed=id;selected=id;detailOpen=false;openedBranches=new Set([id]);scale=1;panX=0;panY=0;$('picker').classList.add('hidden');$('viewer').classList.remove('hidden');$('graph-title').textContent=byId[id].englishFallback?id:`${id} · ${byId[id].th}`;const tip=document.querySelector('#viewer .graph-hint');if(tip&&currentMode==='expand')tip.textContent='แตะคำเพื่อดูความหมายและขยายกิ่ง · แตะซ้ำเพื่อยุบ';draw();window.scrollTo(0,0)}
$('back-list').onclick=()=>{$('viewer').classList.add('hidden');$('picker').classList.remove('hidden');detailOpen=false;cancelAnimationFrame(bubbleRAF);window.scrollTo(0,0)};
function paths(){
 const edges=[],seen=new Set([seed]),queue=[{id:seed,depth:0}];
 while(queue.length){
  const {id,depth}=queue.shift();if(depth>=(currentMode==='expand'?3:1)||seen.size>=22)continue;
  if(currentMode==='expand'&&!openedBranches.has(id))continue;
  const candidates=(modeConfig.map[id]||[]).filter(x=>byId[x]);
  // Prefer matches at the selected level, but don't hide valid structural links.
  const selected=candidates.filter(x=>byId[x].hskLevel===currentLevel);
  const rest=candidates.filter(x=>byId[x].hskLevel!==currentLevel);
  const ordered=[...selected,...rest];
  for(const to of ordered.slice(0,depth===0?8:4)){
   if(to===id||seen.has(to))continue;
   edges.push([id,to]);seen.add(to);queue.push({id:to,depth:depth+1});
  }
 }
 return {edges,ids:[...seen]};
}
function svgEl(tag,attrs={},value){let el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(value!==undefined)el.textContent=value;return el}

// In-place expansion: the selected graph node grows, while neighbours move away.
function linesOf(s,maxChars=16,maxLines=2){
 const chars=Array.from(s||'');const lines=[];
 for(let i=0;i<chars.length;i+=maxChars) lines.push(chars.slice(i,i+maxChars).join(''));
 if(lines.length>maxLines) return [...lines.slice(0,maxLines-1),lines.slice(maxLines-1).join('').slice(0,maxChars-1)+'…'];
 return lines.length?lines:[''];
}
function textLines(parent,arr,y,font,color,step=18,weight=500){
 arr.forEach((str,i)=>parent.append(svgEl('text',{'text-anchor':'middle',y:y+i*step,'font-size':font,fill:color,'font-weight':weight},str)));
}
function draw(){
 cancelAnimationFrame(bubbleRAF);
 const {edges,ids}=paths(),coords={},levels={[seed]:0},queue=[seed];
 while(queue.length){const id=queue.shift();for(const [a,b] of edges){if(a===id&&levels[b]===undefined){levels[b]=levels[id]+1;queue.push(b)}}}
 if(currentMode==='expand'){
  const cols={};ids.forEach(id=>(cols[levels[id]]??=[]).push(id));
  const mx=Math.max(1,...Object.values(levels));
  Object.entries(cols).forEach(([depth,arr])=>arr.forEach((id,i)=>{
   coords[id]={x:172+Number(depth)*Math.min(250,520/mx),y:260+(i-(arr.length-1)/2)*Math.min(160,330/Math.max(1,arr.length-1))};
  }));
 }else{
  coords[seed]={x:450,y:260};const others=ids.filter(x=>x!==seed);
  others.forEach((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/others.length,r=others.length<=2?195:others.length>=5?235:223;coords[id]={x:450+r*Math.cos(a),y:260+r*.79*Math.sin(a)}});
 }
 const svg=$('viz'),scene=$('scene');
 svg.setAttribute('viewBox',window.innerWidth<600?'125 0 650 520':'0 0 900 520');
 scene.replaceChildren();
 const defs=svgEl('defs'),shadow=svgEl('filter',{id:'softShadow',x:'-60%',y:'-60%',width:'220%',height:'220%'});
 shadow.append(svgEl('feDropShadow',{dx:0,dy:6,stdDeviation:9,'flood-color':'#a37f99','flood-opacity':'.13'}));defs.append(shadow);scene.append(defs);
 const world=svgEl('g',{transform:`translate(${panX} ${panY}) translate(450 260) scale(${scale}) translate(-450 -260)`});scene.append(world);
 visualEdges=[];visualNodes=[];
 for(const [a,b] of edges){
  const line=svgEl('path',{fill:'none',stroke:currentMode==='expand'?'#add7c5':currentMode==='build'?'#c8b6e6':'#e2b9cf','stroke-width':currentMode==='expand'?4:3,'stroke-linecap':'round',opacity:detailOpen?'.32':'.72'});
  world.append(line);visualEdges.push({a,b,line});
 }
 ids.forEach((id,i)=>{
  const d=byId[id],root=id===seed,isExpanded=detailOpen&&selected===id;
  const baseW=Math.max(86,52+id.length*34),baseH=88;
  const baseR=id.length>2?59:id.length>1?54:49;
  const expandedR=121,expandedW=Math.max(220,Math.min(290,160+id.length*12)),expandedH=currentMode==='expand'?146:218;
  const fill=root?(currentMode==='expand'?'#b8ddca':'#f4bed5'):(currentMode==='expand'?'#d3eddf':currentMode==='build'?'#e6dcfa':'#f6dcea');
  const color=currentMode==='expand'?'#527c69':currentMode==='build'?'#76618f':'#81536e';
  const group=svgEl('g',{role:'button',tabindex:'0','aria-label':`${id} ${d.py} ${d.th}`,style:'cursor:pointer'});
  const bubble=svgEl('g',{class:isExpanded?'expanded-bubble':'bubble-enter',style:`--enter-delay:${Math.min(i*.06,.32)}s`});
  group.append(bubble);
  if(isExpanded){
   if(currentMode==='expand'){
    bubble.append(svgEl('rect',{x:-expandedW/2,y:-expandedH/2,width:expandedW,height:expandedH,rx:expandedH/2,fill:'#fff5fa',stroke:'#fff','stroke-width':3,filter:'url(#softShadow)'}));
   }else{
    bubble.append(svgEl('circle',{r:expandedR,fill:'#fff5fa',stroke:'#fff','stroke-width':3,filter:'url(#softShadow)'}));
   }
   bubble.append(svgEl('ellipse',{cx:-45,cy:currentMode==='expand'?-48:-71,rx:26,ry:9,fill:'#fff',opacity:'.76',transform:'rotate(-26 -45 -71)'}));
   if(currentMode==='expand'){
    bubble.append(svgEl('text',{'text-anchor':'middle',y:-28,'font-size':d.id.length>5?23:31,'font-weight':700,fill:color},id));
    bubble.append(svgEl('text',{'text-anchor':'middle',y:2,'font-size':17,fill:'#789c89'},d.py));
    textLines(bubble,linesOf(d.th,d.englishFallback?24:16,2),30,d.englishFallback?12:16,color,17,550);
   }else{
    bubble.append(svgEl('text',{'text-anchor':'middle',y:-63,'font-size':d.id.length>5?22:30,'font-weight':700,fill:color},id));
    bubble.append(svgEl('text',{'text-anchor':'middle',y:-38,'font-size':16,fill:'#9f7895'},d.py));
    textLines(bubble,linesOf(d.th,d.englishFallback?23:15,2),-14,d.englishFallback?12:15,color,16,600);
    if(d.ex)bubble.append(svgEl('line',{x1:-80,x2:80,y1:20,y2:20,stroke:'#e8cfdf','stroke-width':1.3}));
    const parts=(d.ex||'').split('—');
    const zh=linesOf((parts[0]||'').trim(),12,2),th=linesOf(parts.slice(1).join('—').trim(),17,2);
    textLines(bubble,zh,45,13,color,16,550);
    textLines(bubble,th,zh.length===1?72:77,11,'#967b8b',14,450);
   }
  }else if(currentMode==='expand'){
   bubble.append(svgEl('rect',{x:-baseW/2,y:-baseH/2,width:baseW,height:baseH,rx:baseH/2,fill,stroke:'#fff','stroke-width':3,filter:'url(#softShadow)'}));
   bubble.append(svgEl('text',{'text-anchor':'middle',y:10,'font-size':id.length>=4?25:id.length>2?29:36,'font-weight':600,fill:color},id));
  }else{
   bubble.append(svgEl('circle',{r:baseR,fill,stroke:'#fff','stroke-width':3,filter:'url(#softShadow)'}));
   bubble.append(svgEl('ellipse',{cx:-baseR*.28,cy:-baseR*.4,rx:baseR*.25,ry:baseR*.1,fill:'#fff',opacity:'.32',transform:'rotate(-22)'}));
   bubble.append(svgEl('text',{'text-anchor':'middle',y:id.length>2?5:9,'font-size':id.length>=4?20:id.length>2?23:id.length>1?28:36,'font-weight':650,fill:color},id));
  }
  // A single tap opens the meaning and reveals the next branch together.
  // Tapping the same word again collapses the detail and its descendants.
  const activate=e=>{
   e.stopPropagation();
   const same=detailOpen&&selected===id;
   if(currentMode==='expand'){
    if(same){
     detailOpen=false;
     const prune=(word,seen=new Set())=>{
      if(seen.has(word))return;seen.add(word);
      if(word!==seed)openedBranches.delete(word);
      (modeConfig.map[word]||[]).forEach(child=>prune(child,seen));
     };
     prune(id);
    }else{
     selected=id;detailOpen=true;
     openedBranches.add(id);
    }
   }else{
    if(same)detailOpen=false;
    else{selected=id;detailOpen=true;}
   }
   draw();
  };
  group.addEventListener('click',activate);
  group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(e)}});
  world.append(group);
  visualNodes.push({id,node:group,coords:coords[id],index:i,rx:isExpanded?(currentMode==='expand'?expandedW/2:expandedR):(currentMode==='expand'?baseW/2:baseR),ry:isExpanded?(currentMode==='expand'?expandedH/2:expandedR):(currentMode==='expand'?baseH/2:baseR)});
 });
 // Push nearby nodes away from the expanded bubble; never overlap the text.
 function placement(){
  const positions={};
  for(const n of visualNodes)positions[n.id]={x:n.coords.x,y:n.coords.y};
  if(detailOpen){
   const chosen=visualNodes.find(n=>n.id===selected);
   if(chosen){
    const center=positions[selected], minDist=chosen.rx+68;
    for(const other of visualNodes){
     if(other.id===selected)continue;
     const p=positions[other.id];let dx=p.x-center.x,dy=p.y-center.y;
     let distance=Math.hypot(dx,dy)||1;
     const limit=minDist+other.rx;
     if(distance<limit){const push=limit-distance+14;const nx=dx/distance,ny=dy/distance;p.x+=nx*push;p.y+=ny*push;}
    }
   }
  }
  return positions;
 }
 const target=placement();
 function tick(now){
  const t=now/1000,positions={};
  for(const n of visualNodes){
   const waveX=Math.cos(t*.5+n.index*2)*5,waveY=Math.sin(t*.72+n.index*1.8)*7;
   const p=target[n.id],x=p.x+waveX,y=p.y+waveY;
   positions[n.id]={x,y};n.node.setAttribute('transform',`translate(${x} ${y})`);
  }
  for(const e of visualEdges){
   const a=positions[e.a],b=positions[e.b];if(!a||!b)continue;
   const na=visualNodes.find(n=>n.id===e.a),nb=visualNodes.find(n=>n.id===e.b);
   const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,ux=dx/dist,uy=dy/dist;
   const x1=a.x+ux*na.rx,y1=a.y+uy*na.ry,x2=b.x-ux*nb.rx,y2=b.y-uy*nb.ry;
   e.line.setAttribute('d',`M${x1} ${y1} C${x1+(x2-x1)*.42} ${y1},${x2-(x2-x1)*.42} ${y2},${x2} ${y2}`);
  }
  if(!document.hidden)bubbleRAF=requestAnimationFrame(tick);
 }
 bubbleRAF=requestAnimationFrame(tick);
}
function zoom(f){scale=Math.max(.65,Math.min(2.4,scale*f));draw()};$('plus').onclick=()=>zoom(1.2);$('minus').onclick=()=>zoom(1/1.2);$('reset').onclick=()=>{scale=1;panX=0;panY=0;draw()};let dragging=false,sx=0,sy=0;const viz=$('viz');viz.addEventListener('pointerdown',e=>{if(e.target.closest('[role="button"]'))return;dragging=true;sx=e.clientX;sy=e.clientY;viz.setPointerCapture(e.pointerId)});viz.addEventListener('pointermove',e=>{if(!dragging)return;const rect=viz.getBoundingClientRect();panX+=(e.clientX-sx)*(viz.viewBox.baseVal.width)/rect.width;panY+=(e.clientY-sy)*520/rect.height;sx=e.clientX;sy=e.clientY;draw()});viz.addEventListener('pointerup',()=>dragging=false);viz.addEventListener('pointercancel',()=>dragging=false);viz.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.92)},{passive:false});
